spring:
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
  datasource:
    hikari:
      # 기본값(10)은 저트래픽 단일 인스턴스엔 과함 - 커넥션마다 스레드/버퍼 오버헤드가 붙는다.
      maximum-pool-size: 5
  task:
    scheduling:
      pool:
        size: 2
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  tomcat:
    threads:
      # 기본값(200)은 대형 서버 기준 - 스레드 하나당 스택으로 기본 1MB씩 예약되므로
      # 저트래픽 사이트엔 크게 과하다. e2-micro(1GB RAM) 배포를 염두에 두고 낮춘다.
      max: 20

app:
  upload:
    dir: uploads

jwt:
  expirationMs: 900000
  refreshExpirationMs: 1209600000

cookie:
  secure:
    false
  same-site:
    Strict

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}
  nickname: ${ADMIN_NICKNAME:관리자}

portone:
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}
  webhook-notice-url: ${PORTONE_WEBHOOK_NOTICE_URL:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  # gemini-3.6-flash 같은 "thinking" 모델은 무료 티어 일일 요청 한도가 20회로 낮고,
  # 사고(thinking) 토큰까지 써서 응답도 느림. 요약/태그 추천처럼 깊은 추론이
  # 필요 없는 작업은 사고 과정이 없는 flash-lite 계열로도 품질 차이가 없어서
  # 이쪽으로 전환 — 별도 할당량 버킷이라 더 여유롭고 응답도 더 빠름.
  # latest 별칭이라 모델 지원 종료로 갈아타야 할 일도 줄어듦.
  model: gemini-flash-lite-latest
