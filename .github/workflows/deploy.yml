name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [ "main" ]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # main으로의 push에 대해 CI 워크플로우가 성공적으로 끝났을 때, 또는 수동 실행 시 배포
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      packages: read

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_PROJECT_PATH }}
            git pull origin main
            # 이미지는 여기(EC2, t2.micro)에서 빌드하지 않는다 - 다른 컨테이너들과
            # 메모리를 나눠 쓰는 상태에서 Gradle 빌드를 돌리면 스왑까지 밀려
            # 들어가 사실상 멈춰버리는 문제가 있었음. CI가 이미 빌드해서 GHCR에
            # 올려둔 이미지를 pull만 한다.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # 정리를 pull 뒤에 두면 디스크가 꽉 찼을 때 pull이 먼저 실패해 정리까지 못 가고
            # 계속 같은 상태로 남는다("no space left on device"). 
            # pull 수행 전 컨테이너가 쓰지 않는 이미지/빌드 캐시 삭제해 새 이미지 공간 확보
            docker image prune -a -f
            docker builder prune -f
            df -h /
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -a -f
